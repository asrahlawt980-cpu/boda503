<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boda | ترجمة بالفرانكو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f; --surface: #13131c; --card: #1a1a28;
      --accent: #7c3aed; --accent2: #06b6d4; --accent3: #f59e0b;
      --text: #f1f1f5; --muted: #6b7280; --border: #2a2a3f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.1) 0%, transparent 50%);
      animation: bgShift 15s ease-in-out infinite alternate; z-index: -1;
    }
    @keyframes bgShift { 0% { transform: translate(0,0); } 100% { transform: translate(-5%,-5%); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    header { padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.8); }
    .logo { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    .logo span { font-family: 'Cairo', sans-serif; font-size: 0.85rem; font-weight: 400; display: block; -webkit-text-fill-color: var(--muted); letter-spacing: 0; margin-top: -4px; }
    .badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; font-size: 0.7rem; padding: 0.3rem 0.8rem; border-radius: 50px; font-weight: 700; }
    .hero { text-align: center; padding: 4rem 2rem 2rem; animation: fadeUp 0.8s ease both; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.2; margin-bottom: 0.8rem; }
    .hero h1 .highlight { background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto 2rem; }
    .translator { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 3rem; animation: fadeUp 0.8s 0.2s ease both; }
    .lang-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .lang-select-wrap { flex: 1; min-width: 160px; }
    .lang-select-wrap label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 1px; }
    select { width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.7rem 1rem; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 0.95rem; cursor: pointer; outline: none; }
    select:focus { border-color: var(--accent); }
    select optgroup { background: var(--surface); color: var(--accent2); font-weight: 700; }
    select option { background: var(--card); color: var(--text); }
    .swap-btn { background: var(--card); border: 1px solid var(--border); color: var(--accent2); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s; margin-top: 1.4rem; flex-shrink: 0; }
    .swap-btn:hover { background: var(--accent); color: white; transform: rotate(180deg); }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media(max-width: 600px) { .panels { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: border-color 0.3s; }
    .panel:focus-within { border-color: var(--accent); }
    .panel-header { padding: 0.7rem 1rem; background: var(--surface); font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .panel-header .lang-name { font-weight: 700; color: var(--text); }
    textarea { width: 100%; min-height: 200px; background: transparent; border: none; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 1.05rem; padding: 1rem; resize: vertical; outline: none; line-height: 1.8; }
    textarea::placeholder { color: var(--muted); }
    .panel-footer { padding: 0.6rem 1rem; background: var(--surface); display: flex; gap: 0.5rem; justify-content: flex-end; }
    .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0.3rem 0.6rem; border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 0.3rem; font-family: 'Cairo', sans-serif; }
    .icon-btn:hover { color: var(--accent2); background: rgba(6,182,212,0.1); }
    .translate-btn { display: block; width: 100%; margin-top: 1rem; padding: 1rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .translate-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,58,237,0.4); }
    .translate-btn:disabled { opacity: 0.6; cursor: wait; }
    .char-count { font-size: 0.72rem; color: var(--muted); }
    .history-section { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 3rem; }
    .section-title { font-size: 1rem; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .history-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; cursor: pointer; transition: all 0.2s; display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 0.5rem; }
    .history-item:hover { border-color: var(--accent); transform: translateX(-3px); }
    .history-item .orig { flex: 1; color: var(--muted); font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .trans { flex: 1; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .langs { font-size: 0.7rem; color: var(--accent2); white-space: nowrap; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: white; padding: 0.8rem 1.5rem; border-radius: 50px; font-size: 0.9rem; font-weight: 700; transition: transform 0.3s; z-index: 999; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .output-panel { position: relative; }
    .loading-overlay { display: none; position: absolute; inset: 0; background: rgba(10,10,15,0.7); border-radius: 16px; align-items: center; justify-content: center; }
    .loading-overlay.show { display: flex; }
    .error-msg { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.9rem; margin-top: 0.8rem; display: none; }
    footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.82rem; }
    footer a { color: var(--accent2); text-decoration: none; }
    .boda-animated {
      font-family: 'Cairo', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      letter-spacing: 3px;
      margin-bottom: 2rem;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(3px, -3px); }
      60% { transform: translate(-3px, -3px); }
      80% { transform: translate(3px, 3px); }
      100% { transform: translate(0); }
    }
    .boda-animated.glitch { animation: gradientMove 3s ease infinite, glitch 0.3s ease; }
    .tagline { color: #ffffff; font-size: 1rem; font-weight: 400; letter-spacing: 2px; margin-bottom: 2rem; opacity: 0.85; }
  </style>
</head>

<div class="toast" id="toast"></div>

<script>
  const LANGUAGES = {
    'ar':'عربي','franco':'فرانكو عربي','en':'إنجليزي','fr':'فرنسي','de':'ألماني',
    'es':'إسباني','it':'إيطالي','tr':'تركي','ru':'روسي','zh':'صيني','ja':'ياباني',
    'ko':'كوري','pt':'برتغالي','hi':'هندي','he':'عبري','id':'إندونيسي','nl':'هولندي',
    'pl':'بولندي','sv':'سويدي','fa':'فارسي','ur':'أردو','bn':'بنغالي','ms':'ملايو',
    'th':'تايلاندي','vi':'فيتنامي','tl':'فلبيني','no':'نرويجي','da':'دنماركي',
    'fi':'فنلندي','el':'يوناني','cs':'تشيكي','hu':'مجري','ro':'روماني','uk':'أوكراني',
    'auto':'اكتشاف تلقائي'
  };

  // تحويل عربي لفرانكو
  function arabicToFranco(text) {
    const map = {
      'ع':'3','ء':'2','أ':'2','إ':'2','آ':'2','ئ':'2','ؤ':'2',
      'ح':'7','خ':'5','غ':'8','ق':'9',
      'ا':'a','ب':'b','ت':'t','ث':'th','ج':'g','د':'d','ذ':'z',
      'ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t',
      'ظ':'z','ف':'f','ك':'k','ل':'l','م':'m','ن':'n','ه':'h',
      'و':'w','ي':'y','ى':'a','ة':'a','لا':'la',
      'َ':'a','ُ':'o','ِ':'e','ّ':'','ً':'an','ٌ':'on','ٍ':'en','ْ':''
    };
    let result = '';
    for (let i = 0; i < text.length; i++) {
      if (text[i] === 'ل' && text[i+1] === 'ا') { result += 'la'; i++; continue; }
      result += map[text[i]] !== undefined ? map[text[i]] : text[i];
    }
    return result;
  }

  // تحويل فرانكو لعربي
  function francoToArabic(text) {
    const map = [
      ['2a','أا'],['2o','أو'],['2','أ'],
      ['3a','عا'],['3o','عو'],['3','ع'],
      ['7a','حا'],['7o','حو'],['7','ح'],
      ['5a','خا'],['5o','خو'],['5','خ'],
      ['8a','غا'],['8o','غو'],['8','غ'],
      ['9a','قا'],['9o','قو'],['9','ق'],
      ['sh','ش'],['th','ث'],['kh','خ'],['gh','غ'],['ph','ف'],
      ['a','ا'],['b','ب'],['t','ت'],['g','ج'],['d','د'],
      ['r','ر'],['z','ز'],['s','س'],['f','ف'],['k','ك'],
      ['l','ل'],['m','م'],['n','ن'],['h','ه'],['w','و'],['y','ي'],
      ['e','ي'],['o','و'],['i','ي'],
    ];
    let result = text.toLowerCase();
    for (const [franco, arabic] of map) {
      result = result.split(franco).join(arabic);
    }
    return result;
  }

  let historyData = JSON.parse(localStorage.getItem('boda_history') || '[]');

  function updateCharCount() {
    const len = document.getElementById('inputText').value.length;
    document.getElementById('charCount').textContent = len + ' / 5000';
  }

  function swapLangs() {
    const f = document.getElementById('fromLang');
    const t = document.getElementById('toLang');
    if (f.value === 'auto') return showToast('مش ممكن تعكس مع الاكتشاف التلقائي');
    const inp = document.getElementById('inputText');
    const out = document.getElementById('outputText');
    [f.value, t.value] = [t.value, f.value];
    [inp.value, out.value] = [out.value, inp.value];
    document.getElementById('fromLangName').textContent = LANGUAGES[f.value] || f.value;
    document.getElementById('toLangName').textContent = LANGUAGES[t.value] || t.value;
    updateCharCount();
  }

  document.getElementById('fromLang').addEventListener('change', () => {
    document.getElementById('fromLangName').textContent = LANGUAGES[document.getElementById('fromLang').value];
  });
  document.getElementById('toLang').addEventListener('change', () => {
    document.getElementById('toLangName').textContent = LANGUAGES[document.getElementById('toLang').value];
  });

  function clearInput() {
    document.getElementById('inputText').value = '';
    document.getElementById('outputText').value = '';
    updateCharCount();
  }

  async function pasteText() {
    try {
      document.getElementById('inputText').value = await navigator.clipboard.readText();
      updateCharCount();
    } catch(e) { showToast('مش قادر يوصل للكليب بورد'); }
  }

  function copyOutput() {
    const text = document.getElementById('outputText').value;
    if (!text) return showToast('مفيش نص للنسخ!');
    navigator.clipboard.writeText(text).then(() => showToast('✅ اتنسخ!'));
  }

  function speakOutput() {
    const text = document.getElementById('outputText').value;
    if (!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = document.getElementById('toLang').value;
    speechSynthesis.speak(utter);
  }

  async function doTranslate() {
    const text = document.getElementById('inputText').value.trim();
    const fromLang = document.getElementById('fromLang').value;
    const toLang = document.getElementById('toLang').value;
    const errorEl = document.getElementById('errorMsg');

    if (!text) return showToast('اكتب حاجة الأول!');
    errorEl.style.display = 'none';

    // لو الترجمة بالفرانكو فقط (بدون API)
    if (fromLang === 'ar' && toLang === 'franco') {
      document.getElementById('outputText').value = arabicToFranco(text);
      saveHistory(text, arabicToFranco(text), fromLang, toLang);
      return showToast('✅ تمت الترجمة!');
    }

    if (fromLang === 'franco' && toLang === 'ar') {
      document.getElementById('outputText').value = francoToArabic(text);
      saveHistory(text, francoToArabic(text), fromLang, toLang);
      return showToast('✅ تمت الترجمة!');
    }

    // باقي اللغات عن طريق MyMemory API
    setLoading(true);
    try {
      let actualFrom = fromLang === 'franco' ? 'ar' : fromLang === 'auto' ? 'ar' : fromLang;
      let actualTo = toLang === 'franco' ? 'ar' : toLang;

      const response = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${actualFrom}|${actualTo}`
      );
      const data = await response.json();
      if (data.responseStatus !== 200) throw new Error('فشلت الترجمة');

      let translation = data.responseData.translatedText;
      if (toLang === 'franco') translation = arabicToFranco(translation);

      document.getElementById('outputText').value = translation;
      saveHistory(text, translation, fromLang, toLang);
      showToast('✅ تمت الترجمة!');

    } catch(e) {
      errorEl.textContent = '❌ ' + e.message;
      errorEl.style.display = 'block';
    } finally {
      setLoading(false);
    }
  }

  function saveHistory(original, translation, fromLang, toLang) {
    const item = {
      from: LANGUAGES[fromLang] || fromLang,
      to: LANGUAGES[toLang] || toLang,
      original, translation
    };
    historyData.unshift(item);
    if (historyData.length > 20) historyData.pop();
    localStorage.setItem('boda_history', JSON.stringify(historyData));
    renderHistory();
  }

  function setLoading(state) {
    const btn = document.getElementById('translateBtn');
    btn.disabled = state;
    btn.textContent = state ? 'جاري الترجمة...' : '🌐 ترجم دلوقتي';
    document.getElementById('loadingOverlay').classList.toggle('show', state);
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    if (!historyData.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:1.5rem;font-size:0.88rem;">مفيش ترجمات لسه</div>';
      return;
    }
    el.innerHTML = historyData.slice(0,8).map(h => `
      <div class="history-item" onclick="document.getElementById('inputText').value='${h.original.replace(/'/g,"\\'")}';document.getElementById('outputText').value='${h.translation.replace(/'/g,"\\'")}';updateCharCount();">
        <div class="langs">${h.from} → ${h.to}</div>
        <div class="orig">${h.original}</div>
        <div class="trans">${h.translation}</div>
      </div>
    `).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  document.getElementById('inputText').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') doTranslate();
  });

  renderHistory();
</script>
</body>
</html>
